# ===========================================
# Production Profile Overrides
# ===========================================
# Activated via: SPRING_PROFILES_ACTIVE=production

spring:
  jpa:
    show-sql: false
    open-in-view: false

  cache:
    type: redis

logging:
  level:
    root: WARN
    com.addexstores: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
  health:
    redis:
      enabled: false
