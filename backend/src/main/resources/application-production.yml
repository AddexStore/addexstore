# ===========================================
# Production Profile Overrides
# ===========================================
# Activated via: SPRING_PROFILES_ACTIVE=production

spring:
  jpa:
    show-sql: false
    open-in-view: false

  cache:
    type: redis

  # The production DB was migrated to V201 before V107-V109 existed in this
  # repository. Allow Flyway to apply those pending, forward-only migrations
  # out of order so the schema catches up to the code. All three use IF NOT
  # EXISTS / idempotent statements, so this is safe to leave enabled.
  flyway:
    out-of-order: true

logging:
  level:
    root: WARN
    com.addexstores: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: ping
  health:
    redis:
      enabled: false
